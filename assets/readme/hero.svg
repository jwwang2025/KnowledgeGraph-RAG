<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="320" viewBox="0 0 1200 320"
     role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">KnowledgeGraph-RAG</title>
  <desc id="heroDesc">知识图谱 + RAG 双驱动大模型对话系统</desc>

  <defs>
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="#0d1117"/>

  <!-- Subtle grid lines (motif: graph edges) -->
  <g stroke="#21262d" stroke-width="1" fill="none">
    <line x1="780" y1="50" x2="780" y2="270"/>
    <line x1="900" y1="50" x2="900" y2="270"/>
    <line x1="1020" y1="50" x2="1020" y2="270"/>
    <line x1="1140" y1="50" x2="1140" y2="270"/>
    <line x1="780" y1="50" x2="1140" y2="50"/>
    <line x1="780" y1="160" x2="1140" y2="160"/>
    <line x1="780" y1="270" x2="1140" y2="270"/>
  </g>

  <!-- Left: Title block -->
  <g transform="translate(64, 56)">
    <!-- Category -->
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#8b949e" font-weight="500">
      RAG · Knowledge Graph · LLM
    </text>
    <!-- Project name -->
    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="46" fill="#e6edf3" font-weight="700">
      KnowledgeGraph-RAG
    </text>
    <!-- Tagline -->
    <text x="0" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="22" fill="#58a6ff" font-weight="500">
      知识图谱 + RAG 双驱动大模型对话系统
    </text>
    <!-- Description -->
    <text x="0" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="16" fill="#8b949e">
      融合结构化知识图谱与非结构化文档检索，
    </text>
    <text x="0" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="16" fill="#8b949e">
      通过 Adaptive-RAG + Self-RAG + CoT 减少幻觉，
    </text>
    <text x="0" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="16" fill="#8b949e">
      实现有依据、可追溯的智能问答。
    </text>

    <!-- Tech badges -->
    <g transform="translate(0, 218)">
      <rect x="0" y="0" width="80" height="26" rx="13" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="40" y="17" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="12" fill="#58a6ff" text-anchor="middle">Python</text>

      <rect x="92" y="0" width="78" height="26" rx="13" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="131" y="17" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="12" fill="#3fb950" text-anchor="middle">Vue 3</text>

      <rect x="182" y="0" width="100" height="26" rx="13" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="232" y="17" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="12" fill="#d29922" text-anchor="middle">ChatGLM-6B</text>

      <rect x="294" y="0" width="90" height="26" rx="13" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="339" y="17" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="12" fill="#f85149" text-anchor="middle">Flask</text>
    </g>
  </g>

  <!-- Right: Knowledge graph motif -->
  <g transform="translate(780, 50)">
    <!-- Graph edges -->
    <line x1="60" y1="60" x2="180" y2="30" stroke="url(#edgeGrad)" stroke-width="2"/>
    <line x1="60" y1="60" x2="180" y2="100" stroke="url(#edgeGrad)" stroke-width="2"/>
    <line x1="180" y1="30" x2="300" y2="60" stroke="url(#edgeGrad)" stroke-width="2"/>
    <line x1="180" y1="100" x2="300" y2="60" stroke="url(#edgeGrad)" stroke-width="2"/>
    <line x1="180" y1="30" x2="180" y2="100" stroke="url(#edgeGrad)" stroke-width="2"/>
    <line x1="60" y1="60" x2="60" y2="180" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="180" y1="100" x2="180" y2="180" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="300" y1="60" x2="300" y2="180" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 4"/>

    <!-- Graph nodes -->
    <circle cx="60" cy="60" r="22" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="60" y="65" font-family="-apple-system, sans-serif" font-size="11" fill="#58a6ff" text-anchor="middle">AI</text>

    <circle cx="180" cy="30" r="22" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="180" y="35" font-family="-apple-system, sans-serif" font-size="10" fill="#3fb950" text-anchor="middle">NLP</text>

    <circle cx="180" cy="100" r="22" fill="#161b22" stroke="#d29922" stroke-width="2"/>
    <text x="180" y="105" font-family="-apple-system, sans-serif" font-size="9" fill="#d29922" text-anchor="middle">KG</text>

    <circle cx="300" cy="60" r="22" fill="#161b22" stroke="#f85149" stroke-width="2"/>
    <text x="300" y="65" font-family="-apple-system, sans-serif" font-size="10" fill="#f85149" text-anchor="middle">RAG</text>

    <!-- Document lines (unstructured source) -->
    <g transform="translate(30, 160)">
      <rect x="0" y="0" width="300" height="80" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <line x1="16" y1="20" x2="200" y2="20" stroke="#30363d" stroke-width="1.5"/>
      <line x1="16" y1="36" x2="260" y2="36" stroke="#30363d" stroke-width="1.5"/>
      <line x1="16" y1="52" x2="180" y2="52" stroke="#30363d" stroke-width="1.5"/>
      <line x1="16" y1="68" x2="220" y2="68" stroke="#30363d" stroke-width="1.5"/>
      <text x="250" y="74" font-family="ui-monospace, monospace" font-size="10" fill="#8b949e" text-anchor="end">docs</text>
    </g>

    <!-- Labels -->
    <text x="60" y="120" font-family="ui-monospace, monospace" font-size="10" fill="#8b949e" text-anchor="middle">structured</text>
    <text x="180" y="155" font-family="ui-monospace, monospace" font-size="10" fill="#8b949e" text-anchor="middle">unstructured</text>
  </g>
</svg>
